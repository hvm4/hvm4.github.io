<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Examen — Gráficos por Computador</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS Y TEMAS (MODO CLARO Y MODO OSCURO ACADÉMICO)
       ========================================================================== */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f8fafc;
      --bg-hover: #f1f5f9;
      --bg-header: rgba(255, 255, 255, 0.92);

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;

      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;

      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-border: #c7d2fe;
      --primary-text: #3730a3;

      --emerald: #10b981;
      --emerald-dark: #059669;
      --emerald-soft: #ecfdf5;
      --emerald-border: #a7f3d0;
      --emerald-text: #065f46;

      --coral: #ef4444;
      --coral-dark: #dc2626;
      --coral-soft: #fef2f2;
      --coral-border: #fecaca;
      --coral-text: #991b1b;

      --amber: #f59e0b;
      --amber-dark: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --amber-text: #92400e;

      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 12px 28px -5px rgba(15, 23, 42, 0.09), 0 8px 10px -6px rgba(15, 23, 42, 0.04);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-surface-alt: #1e293b;
      --bg-hover: #1f2937;
      --bg-header: rgba(17, 24, 39, 0.92);

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;

      --border-color: #1f2937;
      --border-strong: #334155;

      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --primary-border: rgba(99, 102, 241, 0.38);
      --primary-text: #c7d2fe;

      --emerald: #10b981;
      --emerald-dark: #34d399;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --emerald-border: rgba(16, 185, 129, 0.4);
      --emerald-text: #6ee7b7;

      --coral: #ef4444;
      --coral-dark: #f87171;
      --coral-soft: rgba(239, 68, 68, 0.14);
      --coral-border: rgba(239, 68, 68, 0.4);
      --coral-text: #fca5a5;

      --amber: #f59e0b;
      --amber-dark: #fbbf24;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --amber-border: rgba(245, 158, 11, 0.4);
      --amber-text: #fcd34d;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 10px -1px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 15px 30px -5px rgba(0, 0, 0, 0.6);
    }

    /* ==========================================================================
       2. RESET Y ESTRUCTURA GLOBAL
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button, select {
      font-family: inherit;
      cursor: pointer;
    }

    /* ==========================================================================
       3. BARRA SUPERIOR (HEADER)
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      color: inherit;
      user-select: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ==========================================================================
       4. BOTONES Y CONTROLES DE FORMULARIO
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.16s ease;
      user-select: none;
      min-height: 40px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.24);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-hover);
    }

    .btn-emerald {
      background: var(--emerald);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.24);
    }

    .btn-emerald:hover:not(:disabled) {
      background: var(--emerald-dark);
      transform: translateY(-1px);
    }

    .btn-amber {
      background: var(--amber);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.24);
    }

    .btn-amber:hover:not(:disabled) {
      background: var(--amber-dark);
      transform: translateY(-1px);
    }

    .btn-danger-outline {
      background: transparent;
      color: var(--coral);
      border-color: var(--coral-border);
    }

    .btn-danger-outline:hover:not(:disabled) {
      background: var(--coral-soft);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .btn-full {
      width: 100%;
    }

    .select-control {
      width: 100%;
      padding: 0.58rem 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface-alt);
      color: var(--text-primary);
      font-size: 0.84rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
    }

    .select-control:focus {
      border-color: var(--primary);
    }

    /* ==========================================================================
       5. CONTENEDOR PRINCIPAL Y ANIMACIONES
       ========================================================================== */
    .main-container {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeSlideUp 0.26s ease-out forwards;
    }

    /* ==========================================================================
       6. DASHBOARD PRINCIPAL
       ========================================================================== */
    .resume-banner {
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      color: var(--amber-text);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .hero-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4338ca 100%);
      color: #ffffff;
      border-radius: var(--radius-xl);
      padding: 2rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-lg);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.85rem;
    }

    .hero-title {
      font-size: clamp(1.45rem, 3vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .hero-desc {
      max-width: 720px;
      color: #e0e7ff;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .formula-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.15rem;
    }

    .formula-pill {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .metric-value-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 0.6rem;
    }

    .metric-value {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .metric-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .section-heading {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.015em;
    }

    .modes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.25rem;
    }

    .mode-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.45rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.15rem;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-strong);
    }

    .mode-card.featured {
      border: 2px solid var(--primary);
      background: linear-gradient(180deg, var(--primary-soft) 0%, var(--bg-surface) 38%);
    }

    .badge-new {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.35);
    }

    .mode-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
    }

    .mode-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      margin-bottom: 0.5rem;
    }

    .mode-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .mode-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .mode-controls {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .dashboard-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .dashboard-bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .topic-progress-item {
      margin-bottom: 1rem;
    }

    .topic-progress-item:last-child {
      margin-bottom: 0;
    }

    .topic-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.81rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      gap: 0.5rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-surface-alt);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
    }

    /* ==========================================================================
       7. VISTA DE EXAMEN ACTIVO
       ========================================================================== */
    .exam-layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .exam-layout {
        grid-template-columns: 1fr;
      }
    }

    .exam-topbar {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      box-shadow: var(--shadow-sm);
    }

    .live-scoreboard {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .score-chip {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-alt);
    }

    .score-chip.ok {
      background: var(--emerald-soft);
      color: var(--emerald-text);
      border-color: var(--emerald-border);
    }

    .score-chip.err {
      background: var(--coral-soft);
      color: var(--coral-text);
      border-color: var(--coral-border);
    }

    .score-chip.pts {
      background: var(--primary-soft);
      color: var(--primary-text);
      border-color: var(--primary-border);
    }

    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-md);
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-strong);
    }

    .timer-badge.danger {
      background: var(--coral-soft);
      color: var(--coral-text);
      border-color: var(--coral-border);
    }

    .question-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
    }

    @media (max-width: 600px) {
      .question-card {
        padding: 1.25rem;
      }
    }

    .question-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      margin-bottom: 1.15rem;
    }

    .topic-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      background: var(--primary-soft);
      color: var(--primary-text);
      border: 1px solid var(--primary-border);
    }

    .doubt-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .doubt-btn.active {
      background: var(--amber-soft);
      color: var(--amber-text);
      border-color: var(--amber-border);
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 1.35rem;
      color: var(--text-primary);
    }

    .instant-feedback-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 1.15rem;
      animation: fadeSlideUp 0.2s ease-out;
    }

    .instant-feedback-banner.correct {
      background: var(--emerald-soft);
      color: var(--emerald-text);
      border: 1px solid var(--emerald-border);
    }

    .instant-feedback-banner.incorrect {
      background: var(--coral-soft);
      color: var(--coral-text);
      border: 1px solid var(--coral-border);
    }

    .instant-feedback-banner.blank {
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.95rem 1.1rem;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background: var(--bg-surface-alt);
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
    }

    .option-item:hover:not(.locked) {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateX(2px);
    }

    .option-item.selected:not(.locked) {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .option-item.locked {
      cursor: default;
    }

    .option-item.state-correct {
      border-color: var(--emerald) !important;
      background: var(--emerald-soft) !important;
      color: var(--emerald-text);
    }

    .option-item.state-incorrect {
      border-color: var(--coral) !important;
      background: var(--coral-soft) !important;
      color: var(--coral-text);
    }

    .option-item.state-dimmed {
      opacity: 0.65;
    }

    .option-letter {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    .option-item.selected:not(.locked) .option-letter {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .option-item.state-correct .option-letter {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #ffffff;
    }

    .option-item.state-incorrect .option-letter {
      background: var(--coral);
      border-color: var(--coral);
      color: #ffffff;
    }

    .option-content {
      flex: 1;
      font-size: 0.93rem;
      line-height: 1.5;
      padding-top: 0.15rem;
    }

    .option-status-icon {
      font-weight: 800;
      font-size: 0.86rem;
      padding-top: 0.18rem;
      flex-shrink: 0;
    }

    .explanation-box {
      margin-top: 1.35rem;
      padding: 1.15rem 1.25rem;

    /* ============================================================================
       3. GESTIÓN DE ESTADO, ESTADÍSTICAS Y SESIÓN ACTIVA EN LOCALSTORAGE
       ============================================================================ */
    const STORAGE_KEY = "gc_exam_simulator_v3";
    const SESSION_KEY = "gc_active_session_v3";

    class Store {
      constructor() {
        this.data = this.load();
      }

      getDefaultState() {
        return {
          theme: "light",
          examsCompleted: 0,
          history: [],
          topicStats: {
            1: { correct: 0, incorrect: 0, blank: 0 },
            2: { correct: 0, incorrect: 0, blank: 0 },
            3: { correct: 0, incorrect: 0, blank: 0 },
            4: { correct: 0, incorrect: 0, blank: 0 },
            5: { correct: 0, incorrect: 0, blank: 0 }
          },
          failedIds: [] // IDs de preguntas falladas o aún no acertadas
        };
      }

      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return this.getDefaultState();
          const parsed = JSON.parse(raw);
          return {
            ...this.getDefaultState(),
            ...parsed,
            topicStats: {
              ...this.getDefaultState().topicStats,
              ...(parsed.topicStats || {})
            }
          };
        } catch (e) {
          return this.getDefaultState();
        }
      }

      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
        } catch (e) {
          // Ignorar si almacenamiento restringido
        }
      }

      saveActiveSession(sessionObj) {
        try {
          if (!sessionObj) {
            localStorage.removeItem(SESSION_KEY);
          } else {
            // No serializamos timerId ni referencias de función
            const serializable = {
              modeId: sessionObj.modeId,
              modeName: sessionObj.modeName,
              instantMode: sessionObj.instantMode,
              currentIndex: sessionObj.currentIndex,
              questionIds: sessionObj.questions.map(q => q.id),
              optionOrders: sessionObj.optionOrders,
              answers: sessionObj.answers,
              locked: sessionObj.locked,
              doubtful: sessionObj.doubtful,
              timeLeft: sessionObj.timeLeft
            };
            localStorage.setItem(SESSION_KEY, JSON.stringify(serializable));
          }
        } catch (e) {
          // Ignorar
        }
      }

      loadActiveSession() {
        try {
          const raw = localStorage.getItem(SESSION_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          const questions = parsed.questionIds
            .map(id => QUESTIONS_DB.find(q => q.id === id))
            .filter(Boolean);
          if (questions.length !== parsed.questionIds.length || questions.length === 0) {
            return null;
          }
          return {
            ...parsed,
            questions,
            timerId: null
          };
        } catch (e) {
          return null;
        }
      }

      markFailedOrPending(questionId) {
        if (!this.data.failedIds.includes(questionId)) {
          this.data.failedIds.push(questionId);
          this.save();
        }
      }

      removeFromFailed(questionId) {
        const idx = this.data.failedIds.indexOf(questionId);
        if (idx !== -1) {
          this.data.failedIds.splice(idx, 1);
          this.save();
          return true;
        }
        return false;
      }

      recordQuestionOutcome(topicId, outcome) {
        if (!this.data.topicStats[topicId]) {
          this.data.topicStats[topicId] = { correct: 0, incorrect: 0, blank: 0 };
        }
        this.data.topicStats[topicId][outcome]++;
        this.save();
      }

      resetAll() {
        const currentTheme = this.data.theme;
        this.data = this.getDefaultState();
        this.data.theme = currentTheme;
        this.save();
        this.saveActiveSession(null);
      }
    }

    const store = new Store();

    /* ============================================================================
       4. CONTROLADOR PRINCIPAL DE LA APLICACIÓN
       ============================================================================ */
    const app = {
      view: "dashboard", // "dashboard" | "exam" | "results"
      exam: null,
      lastResult: null,
      reviewFilter: "all",

      init() {
        this.applyTheme(store.data.theme);
        this.bindKeyboardShortcuts();
        this.showDashboard();
      },

      // --- Gestión de Tema Claro / Oscuro ---
      applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        const icon = document.getElementById("themeIcon");
        const label = document.getElementById("themeLabel");
        if (icon && label) {
          if (theme === "dark") {
            icon.textContent = "☀️";
            label.textContent = "Modo Claro";
          } else {
            icon.textContent = "🌙";
            label.textContent = "Modo Oscuro";
          }
        }
      },

      toggleTheme() {
        const next = store.data.theme === "dark" ? "light" : "dark";
        store.data.theme = next;
        store.save();
        this.applyTheme(next);
      },

      // --- Notificaciones Toast y Modales ---
      showToast(message, borderColor = "var(--primary)") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.style.borderLeftColor = borderColor;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(8px)";
          toast.style.transition = "all 0.25s ease";
          setTimeout(() => toast.remove(), 260);
        }, 3000);
      },

      openModal({ title, bodyHtml, confirmText = "Confirmar", confirmClass = "btn-primary", cancelText = "Cancelar", onConfirm }) {
        const modal = document.getElementById("customModal");
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;

        const confirmBtn = document.getElementById("modalConfirm");
        const cancelBtn = document.getElementById("modalCancel");

        confirmBtn.textContent = confirmText;
        confirmBtn.className = `btn ${confirmClass}`;
        cancelBtn.textContent = cancelText;

        modal.classList.remove("hidden");

        cancelBtn.onclick = () => modal.classList.add("hidden");
        confirmBtn.onclick = () => {
          modal.classList.add("hidden");
          if (onConfirm) onConfirm();
        };
      },

      confirmResetStats() {
        this.openModal({
          title: "Reiniciar todas las estadísticas",
          bodyHtml: "Se borrarán todos los exámenes realizados, el progreso por tema, la sesión guardada y la lista de preguntas falladas o pendientes. ¿Deseas continuar?",
          confirmText: "Sí, reiniciar todo",
          confirmClass: "btn-amber",
          onConfirm: () => {
            store.resetAll();
            this.showToast("Estadísticas e historial reiniciados correctamente.", "var(--amber)");
            this.showDashboard();
          }
        });
      },

      // --- Atajos de Teclado ---
      bindKeyboardShortcuts() {
        document.addEventListener("keydown", (e) => {
          if (this.view !== "exam" || !this.exam) return;
          const modalOpen = !document.getElementById("customModal").classList.contains("hidden");
          if (modalOpen) return;

          const key = e.key.toLowerCase();
          const keyMap = { "1": 0, "a": 0, "2": 1, "b": 1, "3": 2, "c": 2, "4": 3, "d": 3 };
          if (key in keyMap) {
            e.preventDefault();
            this.selectOption(keyMap[key]);
            return;
          }

          if (e.key === "ArrowRight" || e.key === "Enter") {
            e.preventDefault();
            this.nextQuestion();
            return;
          }

          if (e.key === "ArrowLeft") {
            e.preventDefault();
            this.prevQuestion();
          }
        });
      },

      // --- Algoritmo Fisher-Yates para barajar arrays y opciones ---
      shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      },

      generateOptionOrder() {
        return this.shuffle([0, 1, 2, 3]);
      },

      getWeighted20Questions() {
        let selected = [];
        for (let t = 1; t <= 5; t++) {
          const quota = WEIGHTED_QUOTAS[t];
          const pool = this.shuffle(QUESTIONS_DB.filter(q => q.topic === t));
          selected = selected.concat(pool.slice(0, quota));
        }
        return this.shuffle(selected);
      },

      calculateScores(correct, incorrect, totalQuestions) {
        const netPoints = (correct * 0.50) - (incorrect * 0.16);
        const maxPossiblePoints = totalQuestions * 0.50;
        const normalized10 = maxPossiblePoints > 0
          ? Math.max(0, Math.min(10, (netPoints / maxPossiblePoints) * 10))
          : 0;
        return {
          netPoints: Math.round(netPoints * 100) / 100,
          maxPossiblePoints: Math.round(maxPossiblePoints * 100) / 100,
          score10: Math.round(normalized10 * 100) / 100
        };
      },

      // =========================================================================
      // 5. DASHBOARD PRINCIPAL
      // =========================================================================
      showDashboard() {
        this.view = "dashboard";
        if (this.exam && this.exam.timerId) {
          clearInterval(this.exam.timerId);
        }
        this.exam = null;

        const savedSession = store.loadActiveSession();
        const { examsCompleted, history, topicStats, failedIds } = store.data;

        const avgScore = examsCompleted > 0
          ? (history.reduce((acc, item) => acc + item.score10, 0) / examsCompleted).toFixed(2)
          : "0.00";

        let totalCorrectAll = 0;
        let totalAttemptsAll = 0;
        for (let t = 1; t <= 5; t++) {
          const st = topicStats[t] || { correct: 0, incorrect: 0, blank: 0 };
          totalCorrectAll += st.correct;

      // =========================================================================
      // 6. INICIO Y REANUDACIÓN DE EXÁMENES (CON PERMUTACIÓN FISHER-YATES)
      // =========================================================================
      resumeSavedSession() {
        const saved = store.loadActiveSession();
        if (!saved) {
          this.showToast("No hay ninguna sesión guardada disponible.", "var(--amber)");
          this.showDashboard();
          return;
        }
        this.exam = saved;
        if (this.exam.timeLeft !== null) {
          this.startExamTimer();
        }
        this.view = "exam";
        this.renderExam();
      },

      discardSavedSession() {
        store.saveActiveSession(null);
        this.showToast("Sesión anterior descartada.", "var(--primary)");
        this.showDashboard();
      },

      startOfficialMode() {
        const questions = this.getWeighted20Questions();
        this.launchExam({
          modeId: "official",
          modeName: "Simulacro Ponderado (Oficial)",
          questions,
          instantMode: false,
          durationSeconds: 30 * 60
        });
      },

      startInstantMode() {
        const scope = document.getElementById("instantModeScope").value;
        let questions = [];
        let label = "Corrección Inmediata (1 a 1)";

        if (scope === "weighted20") {
          questions = this.getWeighted20Questions();
          label = "1 a 1 · Ponderado (20 preg.)";
        } else if (scope === "all60") {
          questions = this.shuffle(QUESTIONS_DB);
          label = "1 a 1 · Banco Completo (60 preg.)";
        } else {
          const topicId = Number(scope);
          questions = this.shuffle(QUESTIONS_DB.filter(q => q.topic === topicId));
          label = `1 a 1 · Tema ${topicId} (12 preg.)`;
        }

        this.launchExam({
          modeId: "instant",
          modeName: label,
          questions,
          instantMode: true,
          durationSeconds: null
        });
      },

      startReviewFailedMode() {
        const style = document.getElementById("pendingCorrectionStyle").value;
        const instantMode = style === "instant";
        const failedIds = store.data.failedIds;

        if (failedIds.length === 0) {
          this.openModal({
            title: "¡Sin preguntas pendientes!",
            bodyHtml: "Ahora mismo tienes <strong>0 preguntas falladas o pendientes</strong> en tu registro. ¿Deseas cargar una sesión aleatoria de 15 preguntas para seguir entrenando?",
            confirmText: "Cargar 15 aleatorias",
            confirmClass: "btn-emerald",
            onConfirm: () => {
              const randomQs = this.shuffle(QUESTIONS_DB).slice(0, 15);
              this.launchExam({
                modeId: "review_failed",
                modeName: `Repaso Aleatorio (${instantMode ? "1 a 1" : "Al final"})`,
                questions: randomQs,
                instantMode,
                durationSeconds: null
              });
            }
          });
          return;
        }

        const pendingQs = this.shuffle(QUESTIONS_DB.filter(q => failedIds.includes(q.id)));
        this.launchExam({
          modeId: "review_failed",
          modeName: `Repaso de Pendientes (${pendingQs.length} preg.)`,
          questions: pendingQs,
          instantMode,
          durationSeconds: null
        });
      },

      startFreeTopicMode() {
        const scope = document.getElementById("freeTopicSelect").value;
        const style = document.getElementById("freeCorrectionStyle").value;
        const instantMode = style === "instant";

        let questions = [];
        let label = "";
        if (scope === "all") {
          questions = this.shuffle(QUESTIONS_DB);
          label = `Práctica Libre · Todos los temas (${instantMode ? "1 a 1" : "Al final"})`;
        } else {
          const topicId = Number(scope);
          questions = this.shuffle(QUESTIONS_DB.filter(q => q.topic === topicId));
          label = `Práctica Libre · Tema ${topicId} (${instantMode ? "1 a 1" : "Al final"})`;
        }

        this.launchExam({
          modeId: "topic",
          modeName: label,
          questions,
          instantMode,
          durationSeconds: null
        });
      },

      launchExam({ modeId, modeName, questions, instantMode, durationSeconds }) {
        if (this.exam && this.exam.timerId) {
          clearInterval(this.exam.timerId);
        }

        // Generar una permutación aleatoria Fisher-Yates para las 4 opciones de CADA pregunta
        const optionOrders = questions.map(() => this.generateOptionOrder());

        this.exam = {
          modeId,
          modeName,
          questions,
          optionOrders,
          instantMode,
          currentIndex: 0,
          answers: new Array(questions.length).fill(null), // Guarda el displayIndex (0..3) elegido por el usuario
          locked: new Array(questions.length).fill(false),
          doubtful: new Array(questions.length).fill(false),
          timeLeft: durationSeconds,
          timerId: null
        };

        store.saveActiveSession(this.exam);

        if (durationSeconds !== null) {
          this.startExamTimer();
        }

        this.view = "exam";
        this.renderExam();
      },

      startExamTimer() {
        if (this.exam.timerId) clearInterval(this.exam.timerId);
        this.exam.timerId = setInterval(() => {
          if (!this.exam) return;
          if (this.exam.timeLeft > 0) {
            this.exam.timeLeft--;
            store.saveActiveSession(this.exam);
            this.updateTimerUI();
          } else {
            clearInterval(this.exam.timerId);
            this.showToast("¡Tiempo agotado! Corrigiendo examen automáticamente...", "var(--coral)");
            this.finalizeExam();
          }
        }, 1000);
      },

      updateTimerUI() {
        const el = document.getElementById("timerDisplay");
        if (!el || !this.exam || this.exam.timeLeft === null) return;
        const mins = Math.floor(this.exam.timeLeft / 60);
        const secs = this.exam.timeLeft % 60;
        el.textContent = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        if (this.exam.timeLeft <= 180) {
          el.parentElement.classList.add("danger");
        }
      },

      // =========================================================================
      // 7. LÓGICA DE SELECCIÓN Y NAVEGACIÓN EN EL EXAMEN
      // =========================================================================
      isDisplayOptionCorrect(questionIndex, displayOptIdx) {
        const q = this.exam.questions[questionIndex];
        const origOptIdx = this.exam.optionOrders[questionIndex][displayOptIdx];
        return origOptIdx === q.correct;
      },

      selectOption(displayOptIdx) {
        const ex = this.exam;
        if (!ex) return;
        const idx = ex.currentIndex;

        if (ex.instantMode && ex.locked[idx]) {
          return;
        }

        ex.answers[idx] = displayOptIdx;

        if (ex.instantMode) {
          ex.locked[idx] = true;
          const q = ex.questions[idx];
          const isCorrect = this.isDisplayOptionCorrect(idx, displayOptIdx);

          if (isCorrect) {
            store.recordQuestionOutcome(q.topic, "correct");
            store.removeFromFailed(q.id);
          } else {
            store.recordQuestionOutcome(q.topic, "incorrect");
            store.markFailedOrPending(q.id);
          }
        }

        store.saveActiveSession(ex);
        this.renderExam();
      },

      skipAndRevealInstant() {
        const ex = this.exam;
        if (!ex || !ex.instantMode) return;
        const idx = ex.currentIndex;
        if (ex.locked[idx]) return;

        ex.answers[idx] = null;
        ex.locked[idx] = true;

        const q = ex.questions[idx];
        store.recordQuestionOutcome(q.topic, "blank");
        store.markFailedOrPending(q.id);

        store.saveActiveSession(ex);
        this.renderExam();
      },

      clearStandardAnswer() {
        const ex = this.exam;
        if (!ex || ex.instantMode) return;
        ex.answers[ex.currentIndex] = null;
        store.saveActiveSession(ex);
        this.renderExam();
      },

      toggleDoubt() {
        const ex = this.exam;
        if (!ex) return;
        ex.doubtful[ex.currentIndex] = !ex.doubtful[ex.currentIndex];
        store.saveActiveSession(ex);
        this.renderExam();
      },

      goToQuestion(index) {
        if (!this.exam) return;
        if (index >= 0 && index < this.exam.questions.length) {
          this.exam.currentIndex = index;
          store.saveActiveSession(this.exam);
          this.renderExam();
        }
      },

      prevQuestion() {
        if (this.exam && this.exam.currentIndex > 0) {
          this.exam.currentIndex--;
          store.saveActiveSession(this.exam);
          this.renderExam();
        }
      },

      nextQuestion() {
        if (!this.exam) return;
        if (this.exam.currentIndex < this.exam.questions.length - 1) {
          this.exam.currentIndex++;
          store.saveActiveSession(this.exam);
          this.renderExam();
        } else {
          this.promptFinishExam();
        }
      },

      // =========================================================================
      // 8. RENDERIZADO DE LA VISTA DE EXAMEN
      // =========================================================================
      renderExam() {
        const ex = this.exam;
        const idx = ex.currentIndex;
        const q = ex.questions[idx];
        const order = ex.optionOrders[idx]; // Permutación Fisher-Yates [orig0, orig1, orig2, orig3]
        const userDisplayAns = ex.answers[idx];
        const isLocked = ex.instantMode && ex.locked[idx];
        const isDoubt = ex.doubtful[idx];

        let liveCorrect = 0;
        let liveIncorrect = 0;
        let liveBlank = 0;
        if (ex.instantMode) {
          ex.questions.forEach((item, i) => {
            if (ex.locked[i]) {
              if (ex.answers[i] === null) liveBlank++;
              else if (this.isDisplayOptionCorrect(i, ex.answers[i])) liveCorrect++;
              else liveIncorrect++;
            }
          });
        }
        const liveScoreObj = this.calculateScores(liveCorrect, liveIncorrect, ex.questions.length);

        const root = document.getElementById("appRoot");
        root.innerHTML = `
          <div class="animate-in">
            <!-- BARRA SUPERIOR -->
            <div class="exam-topbar">
              <div>
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.04em;">
                  ${ex.modeName}
                </div>
                <div style="font-size: 1.05rem; font-weight: 800;">
                  Pregunta ${idx + 1} de ${ex.questions.length}
                </div>
              </div>

              ${ex.instantMode ? `
                <div class="live-scoreboard" aria-label="Marcador en vivo">
                  <span class="score-chip ok">✓ ${liveCorrect}</span>
                  <span class="score-chip err">✕ ${liveIncorrect}</span>
                  <span class="score-chip">○ ${liveBlank}</span>
                  <span class="score-chip pts">Pts: ${liveScoreObj.netPoints >= 0 ? "+" : ""}${liveScoreObj.netPoints.toFixed(2)} / ${liveScoreObj.maxPossiblePoints.toFixed(2)} · Nota: ${liveScoreObj.score10.toFixed(2)}/10</span>
                </div>
              ` : ""}

              <div style="display: flex; align-items: center; gap: 0.65rem;">
                ${ex.timeLeft !== null ? `
                  <div class="timer-badge">
                    <span>⏱</span>
                    <span id="timerDisplay">30:00</span>
                  </div>
                ` : ""}
                <button class="btn btn-primary" onclick="app.promptFinishExam()">
                  ${ex.instantMode ? "Finalizar Sesión" : "Entregar Examen"}
                </button>
              </div>
            </div>

            <!-- CUERPO 2 COLUMNAS -->
            <div class="exam-layout">
              <div class="question-card">
                <div class="question-meta-row">
                  <span class="topic-pill">${TOPICS[q.topic]}</span>
                  <button class="doubt-btn ${isDoubt ? "active" : ""}" onclick="app.toggleDoubt()">
                    <span>${isDoubt ? "🚩 Marcada como Dudosa" : "🏳 Marcar Dudosa"}</span>
                  </button>
                </div>

                <h2 class="question-text">${q.question}</h2>

                ${isLocked ? this.renderInstantBanner(idx, userDisplayAns) : ""}

                <!-- OPCIONES PERMUTADAS CON FISHER-YATES -->
                <div class="options-list">
                  ${order.map((origOptIdx, displayIdx) => {
                    const letters = ["A", "B", "C", "D"];
                    const optText = q.options[origOptIdx];
                    let itemClasses = "option-item";
                    let statusBadge = "";

                    if (!isLocked) {
                      if (userDisplayAns === displayIdx) itemClasses += " selected";
                    } else {
                      itemClasses += " locked";
                      const isCorrectOption = origOptIdx === q.correct;
                      const isUserSelected = displayIdx === userDisplayAns;

                      if (isCorrectOption) {
                        itemClasses += " state-correct";
                        statusBadge = `<span class="option-status-icon">✓ Correcta</span>`;
                      } else if (isUserSelected) {
                        itemClasses += " state-incorrect";
                        statusBadge = `<span class="option-status-icon">✕ Tu elección</span>`;
                      } else {
                        itemClasses += " state-dimmed";
                      }
                    }

                    return `
                      <div class="${itemClasses}" onclick="app.selectOption(${displayIdx})" role="button" tabindex="0">
                        <div class="option-letter">${letters[displayIdx]}</div>
                        <div class="option-content">${optText}</div>
                        ${statusBadge}
                      </div>
                    `;
                  }).join("")}
                </div>

                <!-- EXPLICACIÓN TEÓRICA INMEDIATA EN MODO 1 A 1 -->
                ${isLocked ? `
                  <div class="explanation-box">
                    <div class="explanation-title">
                      <span>📘 Explicación Teórica</span>
                    </div>
                    <div class="explanation-body">${q.explanation}</div>
                  </div>
                ` : ""}

                <!-- BOTONES DE ACCIÓN Y NAVEGACIÓN -->
                <div class="question-footer">
                  <div>
                    ${ex.instantMode ? (
                      !isLocked ? `
                        <button class="btn btn-secondary" onclick="app.skipAndRevealInstant()">
                          Dejar en blanco y ver solución (0 pts)
                        </button>
                      ` : `<span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Respuesta corregida y bloqueada</span>`
                    ) : (
                      userDisplayAns !== null ? `
                        <button class="btn btn-ghost" onclick="app.clearStandardAnswer()" style="text-decoration: underline; font-size: 0.82rem;">
                          Dejar en blanco (0 pts)
                        </button>
                      ` : `<span style="font-size: 0.8rem; color: var(--text-muted);">Sin respuesta seleccionada</span>`
                    )}
                  </div>

                  <div class="nav-btn-group">
                    <button class="btn btn-secondary" onclick="app.prevQuestion()" ${idx === 0 ? "disabled" : ""}>
                      ← Anterior
                    </button>
                    <button class="btn ${ex.instantMode && isLocked ? "btn-emerald" : "btn-primary"}" onclick="app.nextQuestion()">
                      ${idx === ex.questions.length - 1 ? "Ver Resultados Finales →" : "Siguiente pregunta →"}
                    </button>
                  </div>
                </div>
              </div>

              <!-- PANEL LATERAL: NAVEGADOR DE PREGUNTAS -->
              <aside class="sidebar-card">
                <div class="sidebar-title">
                  <span>Navegador</span>
                  <span>${idx + 1}/${ex.questions.length}</span>
                </div>

                <div class="nav-grid">
                  ${ex.questions.map((item, i) => {
                    let cellClass = "nav-cell";
                    if (i === idx) cellClass += " current";
                    if (ex.doubtful[i]) cellClass += " has-doubt";

                    if (ex.instantMode) {
                      if (ex.locked[i]) {
                        if (ex.answers[i] === null) cellClass += " cell-blank-locked";
                        else if (this.isDisplayOptionCorrect(i, ex.answers[i])) cellClass += " cell-correct";
                        else cellClass += " cell-incorrect";
                      }
                    } else {
                      if (ex.answers[i] !== null) cellClass += " answered-std";
                    }

                    return `
                      <button class="${cellClass}" onclick="app.goToQuestion(${i})" title="Ir a pregunta ${i + 1}">
                        ${i + 1}
                      </button>
                    `;
                  }).join("")}
                </div>

                <div class="legend-list">
                  ${ex.instantMode ? `
                    <div class="legend-item"><span class="legend-dot" style="background: var(--emerald);"></span> Acierto (+0,50 pts)</div>
                    <div class="legend-item"><span class="legend-dot" style="background: var(--coral);"></span> Fallo (-0,16 pts)</div>
                    <div class="legend-item"><span class="legend-dot" style="background: var(--border-strong);"></span> En blanco / Vista (0 pts)</div>
                  ` : `
                    <div class="legend-item"><span class="legend-dot" style="background: var(--primary);"></span> Respondida</div>
                    <div class="legend-item"><span class="legend-dot" style="background: var(--bg-surface-alt); border: 1px solid var(--border-strong);"></span> Sin responder</div>
                  `}
                  <div class="legend-item"><span class="legend-dot" style="background: var(--amber); border-radius: 50%;"></span> Marcada como dudosa</div>
                </div>

                <div class="kbd-hint">
                  <strong>Atajos de teclado:</strong><br>
                  Teclas <kbd>1</kbd>-<kbd>4</kbd> o <kbd>A</kbd>-<kbd>D</kbd> para responder.<br>
                  <kbd>→</kbd> o <kbd>Enter</kbd> para avanzar.
                </div>
              </aside>
            </div>
          </div>
        `;

        if (ex.timeLeft !== null) {
          this.updateTimerUI();
        }
      },

      renderInstantBanner(questionIdx, userDisplayAns) {
        if (userDisplayAns === null) {
          return `
            <div class="instant-feedback-banner blank">
              <span>○ 0,00 pts · Dejada en blanco (sin penalización)</span>
              <span>Solución mostrada abajo</span>
            </div>
          `;
        }
        if (this.isDisplayOptionCorrect(questionIdx, userDisplayAns)) {
          return `
            <div class="instant-feedback-banner correct">
              <span>✓ +0,50 pts · ¡Correcto!</span>
              <span>Dominada</span>
            </div>
          `;
        }
        return `
          <div class="instant-feedback-banner incorrect">
            <span>✕ -0,16 pts · Incorrecto</span>
            <span>Guardada en pendientes</span>
          </div>
        `;
      },

      // =========================================================================
      // 9. FINALIZACIÓN Y RESULTADOS FINALES
      // =========================================================================
      promptFinishExam() {
        const ex = this.exam;
        if (!ex) return;

        let unansweredCount = 0;
        if (ex.instantMode) {
          unansweredCount = ex.locked.filter(l => !l).length;
        } else {
          unansweredCount = ex.answers.filter(a => a === null).length;
        }
        const doubtfulCount = ex.doubtful.filter(Boolean).length;

        this.openModal({
          title: ex.instantMode ? "¿Finalizar sesión de Corrección Inmediata?" : "¿Entregar y corregir el examen?",
          bodyHtml: `
            ${unansweredCount > 0 ? `<p style="margin-bottom: 0.5rem;">Te quedan <strong>${unansweredCount} preguntas sin responder</strong> (contarán como 0,00 puntos).</p>` : `<p style="margin-bottom: 0.5rem;">Has revisado todas las preguntas de la sesión.</p>`}
            ${doubtfulCount > 0 ? `<p>Tienes <strong>${doubtfulCount} preguntas marcadas como dudosas</strong>.</p>` : ""}
          `,
          confirmText: "Sí, ver resultados",
          confirmClass: "btn-primary",
          onConfirm: () => this.finalizeExam()
        });
      },

      finalizeExam() {
        const ex = this.exam;
        if (!ex) return;
        if (ex.timerId) clearInterval(ex.timerId);

        let correct = 0;
        let incorrect = 0;
        let blank = 0;
        let masteredInSession = 0;

        const topicBreakdown = {
          1: { correct: 0, incorrect: 0, blank: 0, total: 0 },
          2: { correct: 0, incorrect: 0, blank: 0, total: 0 },
          3: { correct: 0, incorrect: 0, blank: 0, total: 0 },
          4: { correct: 0, incorrect: 0, blank: 0, total: 0 },
          5: { correct: 0, incorrect: 0, blank: 0, total: 0 }
        };

        ex.questions.forEach((q, i) => {
          const displayAns = ex.answers[i];
          const wasAlreadyRecorded = ex.instantMode && ex.locked[i];
          topicBreakdown[q.topic].total++;

          if (displayAns === null) {
            blank++;
            topicBreakdown[q.topic].blank++;
            if (!wasAlreadyRecorded) {
              store.recordQuestionOutcome(q.topic, "blank");
              store.markFailedOrPending(q.id);
            }
          } else if (this.isDisplayOptionCorrect(i, displayAns)) {
            correct++;
            topicBreakdown[q.topic].correct++;
            if (!wasAlreadyRecorded) {
              store.recordQuestionOutcome(q.topic, "correct");
            }
            if (store.removeFromFailed(q.id)) {
              masteredInSession++;
            }
          } else {
            incorrect++;
            topicBreakdown[q.topic].incorrect++;
            if (!wasAlreadyRecorded) {
              store.recordQuestionOutcome(q.topic, "incorrect");
              store.markFailedOrPending(q.id);
            }
          }
        });

        const scores = this.calculateScores(correct, incorrect, ex.questions.length);

        const resultData = {
          date: new Date().toISOString(),
          modeId: ex.modeId,
          modeName: ex.modeName,
          total: ex.questions.length,
          correct,
          incorrect,
          blank,
          netPoints: scores.netPoints,
          maxPossiblePoints: scores.maxPossiblePoints,
          score10: scores.score10,
          masteredInSession,
          topicBreakdown,
          questions: ex.questions,
          optionOrders: ex.optionOrders,
          answers: ex.answers,
          doubtful: ex.doubtful
        };

        store.data.examsCompleted++;
        store.data.history.push({
          date: resultData.date,
          modeId: resultData.modeId,
          modeName: resultData.modeName,
          total: resultData.total,
          correct: resultData.correct,
          incorrect: resultData.incorrect,
          blank: resultData.blank,
          netPoints: resultData.netPoints,
          score10: resultData.score10
        });
        store.save();
        store.saveActiveSession(null);

        this.lastResult = resultData;
        this.reviewFilter = "all";
        this.view = "results";
        this.renderResults();
      },

      renderResults() {
        const res = this.lastResult;
        if (!res) return;

        let badgeText = "Aprobado";
        let badgeStyle = "background: var(--primary-soft); color: var(--primary-text); border: 1px solid var(--primary-border);";
        if (res.score10 < 5) {
          badgeText = "Suspenso (< 5,00)";
          badgeStyle = "background: var(--coral-soft); color: var(--coral-text); border: 1px solid var(--coral-border);";
        } else if (res.score10 >= 9) {
          badgeText = "Sobresaliente";
          badgeStyle = "background: var(--emerald-soft); color: var(--emerald-text); border: 1px solid var(--emerald-border);";
        } else if (res.score10 >= 7) {
          badgeText = "Notable";
          badgeStyle = "background: var(--emerald-soft); color: var(--emerald-text); border: 1px solid var(--emerald-border);";
        }

        const doubtfulTotal = res.doubtful.filter(Boolean).length;

        const root = document.getElementById("appRoot");
        root.innerHTML = `
          <div class="animate-in">
            <section class="results-hero">
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
                <div>
                  <div style="font-size: 0.78rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">${res.modeName}</div>
                  <h1 style="font-size: 1.5rem; font-weight: 800;">Resultados y Revisión del Examen</h1>
                </div>
                <span style="padding: 0.35rem 0.9rem; border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 800; ${badgeStyle}">
                  ${badgeText}
                </span>
              </div>

              <div class="results-grid">
                <div class="final-score-box">
                  <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.35rem;">
                    Nota Normalizada
                  </div>
                  <div class="final-score-num" style="color: ${res.score10 >= 5 ? "var(--emerald)" : "var(--coral)"};">
                    ${res.score10.toFixed(2)}
                  </div>
                  <div style="font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem;">
                    sobre 10,00 puntos
                  </div>
                  <div style="margin-top: 0.65rem; padding-top: 0.55rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; font-weight: 700;">
                    Puntuación bruta: <span style="color: ${res.netPoints >= 0 ? "var(--primary)" : "var(--coral)"};">${res.netPoints >= 0 ? "+" : ""}${res.netPoints.toFixed(2)}</span> / ${res.maxPossiblePoints.toFixed(2)} pts
                  </div>
                </div>

                <div>
                  <div class="breakdown-cards">
                    <div class="mini-stat-box" style="border-color: var(--emerald-border); background: var(--emerald-soft);">
                      <div style="font-size: 1.5rem; font-weight: 900; color: var(--emerald-text);">${res.correct}</div>
                      <div style="font-size: 0.78rem; font-weight: 700; color: var(--emerald-text);">Aciertos (+0,50)</div>
                      <div style="font-size: 0.75rem; font-family: var(--font-mono); margin-top: 0.2rem;">+${(res.correct * 0.5).toFixed(2)} pts</div>
                    </div>

                    <div class="mini-stat-box" style="border-color: var(--coral-border); background: var(--coral-soft);">
                      <div style="font-size: 1.5rem; font-weight: 900; color: var(--coral-text);">${res.incorrect}</div>
                      <div style="font-size: 0.78rem; font-weight: 700; color: var(--coral-text);">Fallos (-0,16)</div>
                      <div style="font-size: 0.75rem; font-family: var(--font-mono); margin-top: 0.2rem;">-${(res.incorrect * 0.16).toFixed(2)} pts</div>
                    </div>

                    <div class="mini-stat-box">
                      <div style="font-size: 1.5rem; font-weight: 900;">${res.blank}</div>
                      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary);">En Blanco (0,00)</div>
                      <div style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-top: 0.2rem;">0,00 pts</div>
                    </div>
                  </div>

                  ${res.masteredInSession > 0 ? `
                    <div style="margin-top: 0.85rem; padding: 0.65rem 0.9rem; border-radius: var(--radius-md); background: var(--emerald-soft); border: 1px solid var(--emerald-border); color: var(--emerald-text); font-size: 0.82rem; font-weight: 700;">
                      🎯 ¡Has dominado ${res.masteredInSession} pregunta(s) que tenías pendientes y se han eliminado de tu lista de falladas!
                    </div>
                  ` : ""}

                  <div style="margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.6rem;">
                    ${[1, 2, 3, 4, 5].map(t => {
                      const tb = res.topicBreakdown[t];
                      if (tb.total === 0) return "";
                      const pct = Math.round((tb.correct / tb.total) * 100);
                      return `
                        <div style="padding: 0.6rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-surface-alt); font-size: 0.78rem;">
                          <div style="font-weight: 700; margin-bottom: 0.25rem;">Tema ${t} (${tb.correct}/${tb.total})</div>
                          <div class="progress-track" style="height: 6px;">
                            <div class="progress-fill" style="width: ${pct}%; background: ${pct >= 50 ? "var(--emerald)" : "var(--coral)"};"></div>
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>
              </div>

              <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.65rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <button class="btn btn-secondary" onclick="app.showDashboard()">
                  ← Volver al Menú Principal
                </button>
              </div>
            </section>

            <!-- FILTROS Y REVISIÓN DETALLADA -->
            <section>
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
                <h2 class="section-heading" style="margin-bottom: 0;">Revisión Completa y Explicaciones Teóricas</h2>
                <div class="filter-bar" style="margin-bottom: 0;">
                  <button class="filter-btn ${this.reviewFilter === "all" ? "active" : ""}" onclick="app.setReviewFilter('all')">Todas (${res.total})</button>
                  <button class="filter-btn ${this.reviewFilter === "incorrect" ? "active" : ""}" onclick="app.setReviewFilter('incorrect')">Falladas (${res.incorrect})</button>
                  <button class="filter-btn ${this.reviewFilter === "blank" ? "active" : ""}" onclick="app.setReviewFilter('blank')">En Blanco (${res.blank})</button>
                  <button class="filter-btn ${this.reviewFilter === "doubtful" ? "active" : ""}" onclick="app.setReviewFilter('doubtful')">Dudosas (${doubtfulTotal})</button>
                  <button class="filter-btn ${this.reviewFilter === "correct" ? "active" : ""}" onclick="app.setReviewFilter('correct')">Aciertos (${res.correct})</button>
                </div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 1rem;">
                ${this.renderReviewItems(res)}
              </div>
            </section>
          </div>
        `;
      },

      setReviewFilter(filter) {
        this.reviewFilter = filter;
        this.renderResults();
      },

      renderReviewItems(res) {
        const letters = ["A", "B", "C", "D"];
        const itemsHtml = res.questions.map((q, idx) => {
          const order = res.optionOrders[idx];
          const displayAns = res.answers[idx];
          const isBlank = displayAns === null;
          const isCorrect = !isBlank && order[displayAns] === q.correct;
          const isDoubt = res.doubtful[idx];

          if (this.reviewFilter === "correct" && !isCorrect) return "";
          if (this.reviewFilter === "incorrect" && (isCorrect || isBlank)) return "";
          if (this.reviewFilter === "blank" && !isBlank) return "";
          if (this.reviewFilter === "doubtful" && !isDoubt) return "";

          let statusPill = `<span style="padding: 0.25rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; background: var(--emerald-soft); color: var(--emerald-text); border: 1px solid var(--emerald-border);">✓ Acierto (+0,50)</span>`;
          if (isBlank) {
            statusPill = `<span style="padding: 0.25rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; background: var(--bg-surface-alt); color: var(--text-muted); border: 1px solid var(--border-strong);">○ En blanco (0,00)</span>`;
          } else if (!isCorrect) {
            statusPill = `<span style="padding: 0.25rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; background: var(--coral-soft); color: var(--coral-text); border: 1px solid var(--coral-border);">✕ Fallo (-0,16)</span>`;
          }

          return `
            <article class="question-card">
              <div class="question-meta-row">
                <span class="topic-pill">Pregunta ${idx + 1} · ${TOPICS[q.topic]}</span>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  ${isDoubt ? `<span style="font-size: 0.75rem; font-weight: 700; color: var(--amber-text); background: var(--amber-soft); padding: 0.2rem 0.55rem; border-radius: var(--radius-sm);">🚩 Dudosa</span>` : ""}
                  ${statusPill}
                </div>
              </div>

              <h3 class="question-text" style="font-size: 1.02rem;">${q.question}</h3>

              <div class="options-list">
                ${order.map((origOptIdx, displayIdx) => {
                  const optText = q.options[origOptIdx];
                  let cls = "option-item locked";
                  let icon = "";
                  if (origOptIdx === q.correct) {
                    cls += " state-correct";
                    icon = `<span class="option-status-icon">✓ Correcta</span>`;
                  } else if (displayIdx === displayAns) {
                    cls += " state-incorrect";
                    icon = `<span class="option-status-icon">✕ Tu respuesta</span>`;
                  } else {
                    cls += " state-dimmed";
                  }

                  return `
                    <div class="${cls}" style="padding: 0.75rem 0.95rem;">
                      <div class="option-letter">${letters[displayIdx]}</div>
                      <div class="option-content" style="font-size: 0.88rem;">${optText}</div>
                      ${icon}
                    </div>
                  `;
                }).join("")}
              </div>

              <div class="explanation-box">
                <div class="explanation-title">📘 Explicación Teórica</div>
                <div class="explanation-body">${q.explanation}</div>
              </div>
            </article>
          `;
        }).join("");

        return itemsHtml || `<div class="panel-card" style="text-align: center; color: var(--text-muted);">No hay preguntas en esta categoría de filtro.</div>`;
      }
    };

    window.addEventListener("DOMContentLoaded", () => app.init());
  </script>
</body>
</html>
