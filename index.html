<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Examen — Gráficos por Computador</title>
  <style>
    /* ==========================================================================
       1. VARIABLES DE TEMA Y DESIGN TOKENS (MODO CLARO Y MODO OSCURO)
       ========================================================================== */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

      /* Paleta Base - Modo Claro (Académico Limpio) */
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f8fafc;
      --bg-hover: #f1f5f9;
      --bg-header: rgba(255, 255, 255, 0.92);

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;

      /* Colores Semánticos */
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-border: #c7d2fe;
      --primary-text: #3730a3;

      --emerald: #10b981;
      --emerald-dark: #059669;
      --emerald-soft: #ecfdf5;
      --emerald-border: #a7f3d0;
      --emerald-text: #065f46;

      --coral: #ef4444;
      --coral-dark: #dc2626;
      --coral-soft: #fef2f2;
      --coral-border: #fecaca;
      --coral-text: #991b1b;

      --amber: #f59e0b;
      --amber-dark: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --amber-text: #92400e;

      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-surface-alt: #1e293b;
      --bg-hover: #1f2937;
      --bg-header: rgba(17, 24, 39, 0.92);

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;

      --border-color: #1f2937;
      --border-strong: #334155;

      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --primary-border: rgba(99, 102, 241, 0.38);
      --primary-text: #c7d2fe;

      --emerald: #10b981;
      --emerald-dark: #34d399;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --emerald-border: rgba(16, 185, 129, 0.4);
      --emerald-text: #6ee7b7;

      --coral: #ef4444;
      --coral-dark: #f87171;
      --coral-soft: rgba(239, 68, 68, 0.14);
      --coral-border: rgba(239, 68, 68, 0.4);
      --coral-text: #fca5a5;

      --amber: #f59e0b;
      --amber-dark: #fbbf24;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --amber-border: rgba(245, 158, 11, 0.4);
      --amber-text: #fcd34d;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 10px -1px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 15px 30px -5px rgba(0, 0, 0, 0.6);
    }

    /* ==========================================================================
       2. RESET Y ESTILOS BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button, select {
      font-family: inherit;
      cursor: pointer;
    }

    /* ==========================================================================
       3. CABECERA / NAVEGACIÓN SUPERIOR
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ==========================================================================
       4. BOTONES Y CONTROLES REUTILIZABLES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      user-select: none;
      min-height: 40px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-hover);
    }

    .btn-emerald {
      background: var(--emerald);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-emerald:hover:not(:disabled) {
      background: var(--emerald-dark);
      transform: translateY(-1px);
    }

    .btn-amber {
      background: var(--amber);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }

    .btn-amber:hover:not(:disabled) {
      background: var(--amber-dark);
      transform: translateY(-1px);
    }

    .btn-danger-outline {
      background: transparent;
      color: var(--coral);
      border-color: var(--coral-border);
    }

    .btn-danger-outline:hover:not(:disabled) {
      background: var(--coral-soft);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .btn-lg {
      padding: 0.75rem 1.35rem;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
    }

    .btn-full {
      width: 100%;
    }

    .select-control {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface-alt);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
    }

    .select-control:focus {
      border-color: var(--primary);
    }

    /* ==========================================================================
       5. CONTENEDOR PRINCIPAL Y ANIMACIONES
       ========================================================================== */
    .main-container {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeSlideUp 0.28s ease-out forwards;
    }

    /* ==========================================================================
       6. PANEL PRINCIPAL (DASHBOARD)
       ========================================================================== */
    .hero-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4338ca 100%);
      color: #ffffff;
      border-radius: var(--radius-xl);
      padding: 2rem;
      margin-bottom: 1.75rem;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.85rem;
    }

    .hero-title {
      font-size: clamp(1.5rem, 3vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .hero-desc {
      max-width: 680px;
      color: #e0e7ff;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .formula-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.15rem;
    }

    .formula-pill {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
    }

    /* Tarjetas de Métricas Globales */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .metric-value-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 0.6rem;
    }

    .metric-value {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .metric-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Sección de 4 Modos de Examen */
    .section-heading {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.015em;
    }

    .modes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.25rem;
    }

    .mode-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-strong);
    }

    .mode-card.featured {
      border: 2px solid var(--primary);
      background: linear-gradient(180deg, var(--primary-soft) 0%, var(--bg-surface) 38%);
    }

    .badge-new {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.35);
    }

    .mode-icon-box {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
    }

    .mode-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      margin-bottom: 0.5rem;
    }

    .mode-title {
      font-size: 1.12rem;
      font-weight: 800;
      margin-bottom: 0.45rem;
      line-height: 1.3;
    }

    .mode-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .mode-controls {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    /* Estadísticas por Tema y Historial */
    .dashboard-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .dashboard-bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .topic-progress-item {
      margin-bottom: 1rem;
    }

    .topic-progress-item:last-child {
      margin-bottom: 0;
    }

    .topic-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-surface-alt);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
    }

    /* ==========================================================================
       7. VISTA DE EXAMEN ACTIVO (LAYOUT 2 COLUMNAS: PREGUNTA + PANEL LATERAL)
       ========================================================================== */
    .exam-layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .exam-layout {
        grid-template-columns: 1fr;
      }
    }

    .exam-topbar {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      box-shadow: var(--shadow-sm);
    }

    .live-scoreboard {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    .score-chip {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-alt);
    }

    .score-chip.ok {
      background: var(--emerald-soft);
      color: var(--emerald-text);
      border-color: var(--emerald-border);
    }

    .score-chip.err {
      background: var(--coral-soft);
      color: var(--coral-text);
      border-color: var(--coral-border);
    }

    .score-chip.pts {
      background: var(--primary-soft);
      color: var(--primary-text);
      border-color: var(--primary-border);
    }

    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-md);
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-strong);
    }

    .timer-badge.danger {
      background: var(--coral-soft);
      color: var(--coral-text);
      border-color: var(--coral-border);
    }

    /* Tarjeta Principal de Pregunta */
    .question-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
    }

    @media (max-width: 600px) {
      .question-card {
        padding: 1.25rem;
      }
    }

    .question-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      margin-bottom: 1.15rem;
    }

    .topic-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      background: var(--primary-soft);
      color: var(--primary-text);
      border: 1px solid var(--primary-border);
    }

    .doubt-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .doubt-btn.active {
      background: var(--amber-soft);
      color: var(--amber-text);
      border-color: var(--amber-border);
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 1.35rem;
      color: var(--text-primary);
    }

    /* Banner de Feedback Instantáneo (Modo 1 a 1) */
    .instant-feedback-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 1.15rem;
      animation: fadeSlideUp 0.2s ease-out;
    }

    .instant-feedback-banner.correct {
      background: var(--emerald-soft);
      color: var(--emerald-text);
      border: 1px solid var(--emerald-border);
    }

    .instant-feedback-banner.incorrect {
      background: var(--coral-soft);
      color: var(--coral-text);
      border: 1px solid var(--coral-border);
    }

    .instant-feedback-banner.blank {
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }

    /* Opciones A/B/C/D */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.95rem 1.1rem;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background: var(--bg-surface-alt);
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
    }

    .option-item:hover:not(.locked) {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateX(2px);
    }

    .option-item.selected:not(.locked) {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .option-item.locked {
      cursor: default;
    }

    /* Estados de corrección inmediata */
    .option-item.state-correct {
      border-color: var(--emerald) !important;
      background: var(--emerald-soft) !important;
      color: var(--emerald-text);
    }

    .option-item.state-incorrect {
      border-color: var(--coral) !important;
      background: var(--coral-soft) !important;
      color: var(--coral-text);
    }

    .option-item.state-dimmed {
      opacity: 0.62;
    }

    .option-letter {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.82rem;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    .option-item.selected:not(.locked) .option-letter {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .option-item.state-correct .option-letter {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #ffffff;
    }

    .option-item.state-incorrect .option-letter {
      background: var(--coral);
      border-color: var(--coral);
      color: #ffffff;
    }

    .option-content {
      flex: 1;
      font-size: 0.94rem;
      line-height: 1.5;
      padding-top: 0.15rem;

      font-weight: 800;
      text-transform: uppercase;

      color: var(--primary-text);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;

    .explanation-body {

      color: var(--text-primary);
      line-height: 1.6;

      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;

    /* Panel Lateral de Navegación Rápida */
    .sidebar-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);

      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 5rem;

    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .nav-cell {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface-alt);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.15s ease;
    }

    .nav-cell:hover {
      border-color: var(--primary);
    }

    .nav-cell.current {
      outline: 2px solid var(--text-primary);
      outline-offset: 1px;
      font-weight: 900;
    }

    /* Colores de celda en modo estándar */
    .nav-cell.answered-std {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* Colores de celda en modo 1 a 1 */
    .nav-cell.cell-correct {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #ffffff;
    }

    .nav-cell.cell-incorrect {
      background: var(--coral);
      border-color: var(--coral);
      color: #ffffff;
    }

    .nav-cell.cell-blank-locked {
      background: var(--border-strong);
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    /* Indicador de bandera ámbar (Dudosa) */
    .nav-cell.has-doubt::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
      border: 1.5px solid var(--bg-surface);
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .kbd-hint {
      margin-top: 0.85rem;
      padding: 0.65rem;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    kbd {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* ==========================================================================
       8. VISTA DE RESULTADOS FINALES
       ========================================================================== */
    .results-hero {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      margin-bottom: 1.75rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1.5rem;
      align-items: center;
      margin: 1.25rem 0;
    }

    @media (max-width: 720px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }

    .final-score-box {
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      text-align: center;
    }

    .final-score-num {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .breakdown-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .mini-stat-box {
      padding: 0.95rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-alt);
      text-align: center;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.15rem;
    }

    .filter-btn {
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;

       9. MODAL DE CONFIRMACIÓN Y TOASTS
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      max-width: 440px;
      width: 100%;
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      animation: fadeSlideUp 0.2s ease-out;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .modal-body {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 1.35rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    .toast-container {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 70;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 340px;
    }

    .toast {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      animation: fadeSlideUp 0.2s ease-out;
    }

    /* Tabla Historial */
    .history-table-wrap {
      overflow-x: auto;
    }

    table.history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: left;
    }

    table.history-table th {
      padding: 0.65rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: 700;
    }

    table.history-table td {
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>

    /* ============================================================================
       2. GESTIÓN DE ESTADO Y PERSISTENCIA EN LOCALSTORAGE
       ============================================================================ */
    const STORAGE_KEY = "gc_exam_simulator_v2";

    class Store {
      constructor() {
        this.data = this.load();
      }

      getDefaultState() {
        return {
          theme: "light",
          examsCompleted: 0,
          history: [], // { date, modeId, modeName, total, correct, incorrect, blank, netPoints, score10 }
          topicStats: {
            1: { correct: 0, incorrect: 0, blank: 0 },
            2: { correct: 0, incorrect: 0, blank: 0 },
            3: { correct: 0, incorrect: 0, blank: 0 },
            4: { correct: 0, incorrect: 0, blank: 0 },
            5: { correct: 0, incorrect: 0, blank: 0 }
          },
          failedIds: [] // IDs de preguntas falladas o dejadas en blanco sin dominar
        };
      }

      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return this.getDefaultState();
          const parsed = JSON.parse(raw);
          return {
            ...this.getDefaultState(),
            ...parsed,
            topicStats: {
              ...this.getDefaultState().topicStats,
              ...(parsed.topicStats || {})
            }
          };
        } catch (e) {
          return this.getDefaultState();
        }
      }

      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
        } catch (e) {
          // Fallback silencioso si localStorage está restringido
        }
      }

      markFailedOrPending(questionId) {
        if (!this.data.failedIds.includes(questionId)) {
          this.data.failedIds.push(questionId);
          this.save();
        }
      }

      removeFromFailed(questionId) {
        const idx = this.data.failedIds.indexOf(questionId);
        if (idx !== -1) {
          this.data.failedIds.splice(idx, 1);
          this.save();
          return true;
        }
        return false;
      }

      recordQuestionOutcome(topicId, outcome) {
        if (!this.data.topicStats[topicId]) {
          this.data.topicStats[topicId] = { correct: 0, incorrect: 0, blank: 0 };
        }
        this.data.topicStats[topicId][outcome]++;
        this.save();
      }

      resetAll() {
        const currentTheme = this.data.theme;
        this.data = this.getDefaultState();
        this.data.theme = currentTheme;
        this.save();
      }
    }

    const store = new Store();

      applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        const icon = document.getElementById("themeIcon");

        if (icon && label) {
          if (theme === "dark") {
            icon.textContent = "☀️";
            label.textContent = "Modo Claro";
          } else {
            icon.textContent = "🌙";
            label.textContent = "Modo Oscuro";
          }
        }
      },

      toggleTheme() {
        const next = store.data.theme === "dark" ? "light" : "dark";
        store.data.theme = next;
        store.save();
        this.applyTheme(next);
      },

      // --- Notificaciones Toast y Modales ---
      showToast(message, borderColor = "var(--primary)") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.style.borderLeftColor = borderColor;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(8px)";
          toast.style.transition = "all 0.25s ease";
          setTimeout(() => toast.remove(), 260);
        }, 3000);
      },

      openModal({ title, bodyHtml, confirmText = "Confirmar", confirmClass = "btn-primary", cancelText = "Cancelar", onConfirm }) {
        const modal = document.getElementById("customModal");
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;

        const confirmBtn = document.getElementById("modalConfirm");
        const cancelBtn = document.getElementById("modalCancel");

        confirmBtn.textContent = confirmText;
        confirmBtn.className = `btn ${confirmClass}`;
        cancelBtn.textContent = cancelText;

        modal.classList.remove("hidden");

        cancelBtn.onclick = () => modal.classList.add("hidden");
        confirmBtn.onclick = () => {
          modal.classList.add("hidden");
          if (onConfirm) onConfirm();
        };

        this.openModal({

          }
        });
      },

      // --- Atajos de Teclado (Modo 1 a 1 y Navegación) ---
      bindKeyboardShortcuts() {
        document.addEventListener("keydown", (e) => {
          if (this.view !== "exam" || !this.exam) return;
          const modalOpen = !document.getElementById("customModal").classList.contains("hidden");
          if (modalOpen) return;

          const key = e.key.toLowerCase();
          // Teclas 1-4 o A-D para seleccionar opción
          const keyMap = { "1": 0, "a": 0, "2": 1, "b": 1, "3": 2, "c": 2, "4": 3, "d": 3 };
          if (key in keyMap) {
            e.preventDefault();
            this.selectOption(keyMap[key]);
            return;
          }

          // Flecha Derecha o Enter para avanzar
          if (e.key === "ArrowRight" || e.key === "Enter") {
            e.preventDefault();
            this.nextQuestion();
            return;
          }

          // Flecha Izquierda para retroceder
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            this.prevQuestion();
          }
        });
      },

      // --- Utilidades de Cálculo y Aleatoriedad ---
      shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      },

      calculateScores(correct, incorrect, totalQuestions) {
        const netPoints = (correct * 0.50) - (incorrect * 0.16);
        const maxPossiblePoints = totalQuestions * 0.50;
        const normalized10 = maxPossiblePoints > 0
          ? Math.max(0, Math.min(10, (netPoints / maxPossiblePoints) * 10))
          : 0;
        return {
          netPoints: Math.round(netPoints * 100) / 100,
          maxPossiblePoints: Math.round(maxPossiblePoints * 100) / 100,
          score10: Math.round(normalized10 * 100) / 100
        };
      },

      getBalanced20Questions() {
        // 4 preguntas aleatorias por cada uno de los 5 temas = 20 preguntas
        let selected = [];
        for (let t = 1; t <= 5; t++) {
          const pool = this.shuffle(QUESTIONS_DB.filter(q => q.topic === t));
          selected = selected.concat(pool.slice(0, 4));
        }
        return this.shuffle(selected);
      },
